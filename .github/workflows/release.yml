name: Publish signed Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AEROPLAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Signing secrets are missing. See GITHUB_RELEASES.md.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aeroplay-release.p12"
      - name: Test and build signed APK
        env:
          AEROPLAY_KEYSTORE_PATH: ${{ runner.temp }}/aeroplay-release.p12
          AEROPLAY_KEYSTORE_PASSWORD: ${{ secrets.AEROPLAY_KEYSTORE_PASSWORD }}
          AEROPLAY_KEY_ALIAS: ${{ secrets.AEROPLAY_KEY_ALIAS }}
          AEROPLAY_KEY_PASSWORD: ${{ secrets.AEROPLAY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PgithubRepository="$GITHUB_REPOSITORY" \
            -PyoutubeAccountSyncEnabled=false -PyoutubeApiOnlyMode=false --console=plain
      - name: Validate and package release assets
        run: |
          node scripts/create-release.mjs
          VERSION=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then test "$GITHUB_REF_NAME" = "$TAG"; fi
          git rev-parse "$TAG" >/dev/null
          git archive --format=zip --prefix=AeroPlay/ "$TAG" > "dist/AeroPlay-source-$TAG.zip"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "AeroPlay $RELEASE_TAG" --notes-file RELEASE_NOTES.md dist/*.apk dist/update.json dist/SHA256SUMS.txt dist/*.zip
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aeroplay-release.p12"
